services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PAKISTANI_LAWYER_API_KEY: "${PAKISTANI_LAWYER_API_KEY:-local-development-key}"
      QA_RATE_LIMIT_PER_MINUTE: "${QA_RATE_LIMIT_PER_MINUTE:-30}"
      PAKISTANI_LAWYER_ENV: "${PAKISTANI_LAWYER_ENV:-development}"
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-0}"
      SEARCH_RATE_LIMIT_PER_MINUTE: "${SEARCH_RATE_LIMIT_PER_MINUTE:-120}"
      LLM_PROVIDER: "${LLM_PROVIDER:-local}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-5}"
      RETRIEVAL_MIN_SCORE: "${RETRIEVAL_MIN_SCORE:-0.27}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

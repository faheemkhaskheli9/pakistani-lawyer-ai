services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PAKISTANI_LAWYER_API_KEY: "${PAKISTANI_LAWYER_API_KEY:?Set PAKISTANI_LAWYER_API_KEY in .env}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      QA_RATE_LIMIT_PER_MINUTE: "${QA_RATE_LIMIT_PER_MINUTE:-30}"
      RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-5}"
      RETRIEVAL_MIN_SCORE: "${RETRIEVAL_MIN_SCORE:-0.20}"
      INDEX_DIR: "${INDEX_DIR:-data/index}"
      APP_ENV: "${APP_ENV:-development}"
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - legal_index:/app/data/index
    restart: unless-stopped

volumes:
  legal_index:

[project]
name = "pakistani-lawyer-ai"
version = "0.1.0"
description = "Retrieval-grounded legal information assistant over public-domain Pakistani statutes and case law"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "numpy>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only needed for EMBEDDING_PROVIDER=sentence-transformers; the default
# "hashing" provider needs neither this nor a model download.
embeddings = [
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
anthropic = [
    "anthropic>=0.40",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.setuptools.package-data]
legal_core = ["static/*.html"]

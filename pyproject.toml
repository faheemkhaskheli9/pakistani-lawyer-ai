[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakistani-lawyer-ai"
version = "0.1.0"
description = "Retrieval-grounded legal information assistant over public-domain Pakistani statutes and case law"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "numpy>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only needed for EMBEDDING_PROVIDER=sentence-transformers; the default
# "hashing" provider needs neither this nor a model download.
embeddings = [
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
